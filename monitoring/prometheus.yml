# Prometheus configuration for HostelFix monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "hostelfix-app"
    scrape_interval: 10s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:3000"]
        labels:
          app: "hostelfix"
          environment: "production"

  - job_name: "hostelfix-local"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:3000"]
        labels:
          app: "hostelfix"
          environment: "development"
